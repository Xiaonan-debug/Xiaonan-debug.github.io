lead: >-
  I study large language models that improve themselves and act in the world &mdash;
  recursive self-improvement, cybersecurity, agents, post-training, and synthetic data.

bio: >-
  I am a Ph.D. student in Computer Science and Engineering at the
  <a href="https://www.nd.edu/">University of Notre Dame</a>, advised by
  Prof. <a href="https://sites.nd.edu/xiangliang-zhang/">Xiangliang Zhang</a>.
  My first-author work builds adaptive evaluation for coding agents on real-world
  security vulnerabilities, synthetic-data training that does not collapse, and
  automatic optimization of benchmark datasets. Previously, I was a Student
  Researcher at <a href="https://bakeai.inc/">Bake AI</a>, working on self-evolving
  research agents, and received my B.S. in Data Science and Computer Science from
  <a href="https://hkust.edu.hk/">HKUST</a>.

