# First-author work, newest first. fig: secprobe | kite | refinelab
work:
  - kicker: arXiv &middot; Sep 2026
    fig: secprobe
    title: "SecProbe: Adaptive Evaluation of Coding Agents on Cybersecurity Vulnerabilities"
    authors: Xiaonan Luo, Yue Huang, Kehan Guo, Ping He, Chuan Zou, Chujie Gao, Lichi Li, Yuchen Ma, Zhangchen Xu, Zichen Chen, Yufei Han, Xiangliang Zhang
    summary: >-
      Static benchmarks spend most of their budget on tasks that tell us little about a
      given agent. SecProbe treats evaluation as measurement: it uses Item Response
      Theory to estimate a coding agent's ability on the fly, selects the
      repository-scale vulnerability-repair tasks that are most informative at that
      ability level, and synthesizes new executable tasks, with exploit-based tests and
      reference patches, when the existing pool lacks coverage.
    metrics:
      - { value: "353", label: repository-scale tasks }
      - { value: "151", label: CWE types }
      - { value: "6", label: programming languages }
      - { value: "9", label: frontier models evaluated }
      - { value: "28.33%", label: best success rate }
      - { value: "29.5%", label: fewer tasks for the same estimate }
    caption: Tasks whose difficulty sits near an agent's current ability estimate carry the most information. SecProbe evaluates on those tasks and synthesizes new ones when the pool has gaps.
    links:
      - { label: Project page, url: "https://xiaonan-debug.github.io/secprobe-page/" }
      - { label: Paper, url: "https://arxiv.org/abs/2609.33763" }
      - { label: PDF, url: "https://arxiv.org/pdf/2609.33763" }

  - kicker: arXiv &middot; Jul 2026
    fig: kite
    title: "Learning from Synthetic Data without Model Collapse in Iterative Instruction Tuning"
    authors: Xiaonan Luo, Yue Huang, Kehan Guo, Ping He, Chuan Zou, Ting Hua, Xiangliang Zhang
    summary: >-
      Training a model on its own synthetic data, generation after generation, is
      widely expected to cause collapse. Using DINA-based skill diagnosis, we show that
      collapse in iterative instruction tuning is a polarization of competence:
      synthetic training reinforces skills that are already strong and erodes those
      that are weakly supported. We propose KITE, which keeps improvement stable
      across generations.
    points:
      - title: Weakness-guided generation
        body: Diagnoses which skills a model lacks and generates candidate instructions that target them.
      - title: Boundary-aware curation
        body: Keeps examples near the model's uncertainty boundary, where training signal is highest.
      - title: Stable over generations
        body: More stable multi-generation gains than strong synthetic-data baselines across reasoning benchmarks.
    caption: Illustration. Naive self-training pulls strong and weak skills apart over generations; KITE raises both.
    links:
      - { label: Paper, url: "https://arxiv.org/abs/2607.17043" }
      - { label: PDF, url: "https://arxiv.org/pdf/2607.17043" }

  - kicker: AAAI 2026
    fig: refinelab
    title: "Better Datasets Start From RefineLab: Automatic Optimization for High-Quality Dataset Refinement"
    authors: Xiaonan Luo*, Yue Huang*, Ping He, Xiangliang Zhang
    summary: >-
      Benchmarks drift away from what they are meant to measure. RefineLab treats QA
      dataset refinement as an optimization problem: given explicit quality targets
      and a token budget, it formulates refinement as an integer linear program that
      selects which coverage, difficulty, and factual-consistency edits to apply, so the
      refined dataset matches the targets.
    points:
      - title: Refinement as an ILP
        body: Chooses edits under a token budget to meet explicit coverage, difficulty, and consistency targets.
      - title: Modular operators
        body: Refinement operators that can be combined and evaluated independently.
      - title: Validated on standard benchmarks
        body: Stable evaluation improvements on MMLU, GSM8K, and HumanEval.
    caption: Schematic. Candidate edits are scored against quality targets; an ILP picks the best set within the token budget.
    links:
      - { label: Paper, url: "https://arxiv.org/abs/2511.06530" }
      - { label: PDF, url: "https://arxiv.org/pdf/2511.06530" }

research:
  - title: Recursive self-improvement
    body: Systems that get better by improving themselves, from research agents that keep findings across sessions and verify progress against fixed evaluators, to models trained on their own data without collapsing.
  - title: Cybersecurity
    body: Measuring and improving how coding agents find and repair real-world vulnerabilities, with executable tasks, exploit-based tests, and adaptive evaluation.
  - title: Agents
    body: LLM agents that operate over long horizons, including agent harnesses that learn from experience and the risks that emerge when many agents interact.
  - title: Post-training
    body: Post-training that makes models more capable and reliable, including adaptive reasoning strategies and rewards for answers that are right for the right reasons.
  - title: Synthetic data
    body: When synthetic data helps and when it hurts, and how to generate, curate, and refine data around a model's actual weaknesses and an evaluation's actual goals.

